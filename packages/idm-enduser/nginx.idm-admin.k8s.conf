server {
    listen 8080;

    # The idm-admin-ui build sets publicPath='./' so asset links in index.html
    # are relative to the page URL. The deployed app is accessed via /platform/,
    # so nginx must serve both /platform/ (the app entry point) and
    # /platform/js|css|... (assets) from the same docroot as /. The two
    # locations point at the same files but use different try_files orderings:
    #
    #   /platform uses alias + ($uri, $uri/index.html, $uri/, /index.html).
    #     The lodestar deployment livecheck hits GET /platform (no trailing
    #     slash). With $uri/ ahead of $uri/index.html, nginx would map that to
    #     the alias root directory and issue a 301 → /platform/, which the
    #     livecheck treats as not-ready and the deployment times out.
    #     Probing $uri/index.html first returns 200 directly.
    #
    #   / uses root + ($uri, $uri/, /index.html) — the standard SPA fallback.
    #     There is no equivalent external livecheck against /, so the
    #     redirect-vs-200 distinction does not matter here.
    location /platform {
        alias /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxies OpenIDM requests to the idm service in the same k8s namespace
    location /openidm {
        proxy_pass http://idm:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
